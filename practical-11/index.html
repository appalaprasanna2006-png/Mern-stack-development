<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Variables</title>
    <style>
        :root{
            --color:yellow;
            --defop:0.4;
            --defpad:23px;
            --secolor:green;
            }
        *{
            padding:0;
            margin:0;
        }
        .nav{
            background-color:var(--color);
        }
        ul{
            display:flex;
        }
        ul li{
            list-style:none;
            opacity:var(--defop);
            padding:var(--defpad);
            border:2px solid black;
        }
        ul li:first-child{
            background-color:var(--secolor);
        }
    </style>
</head>
<body>
    <div class="nav">

        <ul> 
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </div>
    <div class="container">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Repudiandae alias eaque blanditiis explicabo deserunt obcaecati corporis. Minus adipisci autem assumenda!
    </div>
</body>
</html>
