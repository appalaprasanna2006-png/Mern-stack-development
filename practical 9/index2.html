<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS List Styling</title>
    <style>
        nav ul li {
            list-style: devanagari;
            list-style-type: "🔥";
            background-color: yellow;
            list-style-position: inside;
            border: 2px solid palevioletred;
            /* list-style: disc inside url("https://www.mathworks.com/matlabcentral/discussions/uploaded_files/26198/image.gif"); */
            /* list-style-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSr4jZTQdNv3qniH9ECqR3Ag-BpJtOppPYBT80K6RG2rw&s=10"); */
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>Contact us</li>
            <li>About us</li>
        </ul>
    </nav>
</body>

</html>
